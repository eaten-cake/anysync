[package]
name = "anysync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
httpdate = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.9"
walkdir = "2"
